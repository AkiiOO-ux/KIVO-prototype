<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>

    <div class="login-box">
        <div class="dashboard-bar">
            <span class="left-text"></span>
            <span class="right-text">kivo</span>
        </div>

        <h2>Create Your Account</h2>

        <label for="name">FULL NAME</label>
        <input type="text" id="name" placeholder="Enter your full name">

        <label for="email">EMAIL ADDRESS</label>
        <input type="text" id="email" placeholder="Enter your email">

        <label for="password">PASSWORD</label>
        <input type="password" id="password" placeholder="Create a password">

        <label for="confirm-password">CONFIRM PASSWORD</label>
        <input type="password" id="confirm-password" placeholder="Re-enter your password">

        <button id="createAccountBtn">CREATE ACCOUNT</button>

        <p class="create-account" onclick="window.location.href='Login.html'">Back to Sign In</p>
    </div>

    <script>
        document.getElementById("createAccountBtn").addEventListener("click", function() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirm-password").value.trim();

            if (!name || !email || !password || !confirmPassword) {
                alert("⚠️ Please fill out all fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("❌ Passwords do not match.");
                return;
            }

            alert(`✅ Account created successfully!\nWelcome, ${name}!`);
            // You can redirect after success if you want:
            // window.location.href = "Login.html";
        });
    </script>

</body>
</html>
